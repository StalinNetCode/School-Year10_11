<script>
"use strict";

/* ---------- Answer validation ---------- */
const num=s=>{s=String(s).toLowerCase().trim().replace(/−/g,'-');const mx=s.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(mx)return(mx[1]?-1:1)*(+mx[2]+mx[3]/mx[4]);s=s.replace(/[°%£\s,]|cm|units?|degrees?|²|³/g,'').replace(/^[a-z]=/,'').replace(/[a-z]+$/,'');const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);return m?m[1]/m[2]:/^-?\d*\.?\d+$/.test(s)?+s:NaN};

const nl=s=>String(s).toLowerCase().replace(/[x=°%£]|cm|units?|degrees?/g,'').replace(/−/g,'-').split(/[,;]|\band\b|\bor\b|\s+/).filter(Boolean).map(num);
const check=(q,v)=>Array.isArray(q.a)?(()=>{const g=nl(v).sort((a,b)=>a-b),e=[...q.a].sort((a,b)=>a-b);return g.length==e.length&&g.every((x,i)=>Math.abs(x-e[i])<0.005)})():typeof q.a==='number'?Math.abs(num(v)-q.a)<0.005:[q.a,...(q.alt||[])].some(x=>{const a=pn(x);return norm(x)===norm(v)||(a!==null&&a===pn(v))});

for(let i=0;i<28;i++){const e=document.createElement('span');e.className='cf';e.textContent=['🐶','🎉','👏','⭐'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';document.body.append(e);setTimeout(()=>e.remove(),2300)}}
/* ---------- Views ---------- */
const V={
home:()=>`<h1>GCSE Practice Portal</h1><p class=mu>Type your answers, earn Puppies 🐶 and watch your total grow.</p><div class=card><label>Student Name<input id=nm value="${esc(S.name)}" placeholder="e.g. Smithy" autocomplete=off></label><label>Subject<select id=sb><option value="">Choose a subject…</option>${SUBJ.map(s=>`<option ${s==S.subj?'selected':''}>${s}</option>`).join('')}</select></label><label>Exam Board<select id=bd><option value="">${TBC}</option>${BOARDS.map(b=>`<option ${S.subj&&b==S.board?'selected':''}>${b}</option>`).join('')}</select></label><p class="mu hint" id=bn>${bnote(S.subj)}</p><p class=err id=er></p><button data-a=go>Continue</button></div>`,
subj:()=>{const B=BANK[S.subj]||{},G=TOPICS[S.subj],anyQ=Object.keys(B).length>0,mix=S.topic=='Mixed',ready=S.diff>=0&&S.topic&&(mix?anyQ:!!B[S.topic]);

test:()=>{const t=S.t,q=t.qs[t.i];return `<p><b>${esc(t.id)}</b> <span class=mu>(Set ${t.setNo} of 10)</span></p><div class=meta><span>Question ${t.i+1} of 10</span><span>${DIFF[S.diff]}</span><span>${esc(q.topic)}</span><span>${esc(brd(S.board))}</span><span>🐶 ${t.pup} earned</span><span>${t.qs.filter(x=>!x.done).length} left</span></div><div class=card><h2>Question</h2><p class=q>${q.q}</p><h3>Your Answer</h3><input id=ans value="${esc(q.last||'')}" ${q.done?'disabled':''} placeholder="Type your answer" autocomplete=off>${typeof q.a==='string'?'<p class=mu>Type powers with ^, for example 3x^2 - 5x + 2.</p>':''}<div><button data-a=chk ${q.done?'disabled':''}>Check Answer</button><button class=g data-a=exp>Explain</button><button class=g data-a=cor>Correction</button></div>${q.fb?`<p class="fb ${q.ok?'ok':'bad'}" role=status>${q.fb}</p>`:''}${q.showEx?`<div class=pn><h3>Explain</h3><p>${q.m}</p></div>`:''}${q.showCor?`<div class=pn><h3>Correction</h3><p><b>Correct answer:</b> ${esc(ans(q))}</p><p><b>Method:</b> ${q.m}</p><p><b>Working:</b> ${q.w}</p><p><b>Your answer:</b> ${q.ok?'Correct.':q.last?`You wrote "${esc(q.last)}", which doesn't match ${esc(ans(q))}. Compare it with the working above.`:'You did not enter an answer.'}</p><p class=mu>No Puppies are awarded for using Correction.</p></div>`:''}${q.done?`<button data-a=next>${t.i==9?'Finish test':'Next question'} →</button>`:''}</div>`},

let PV='';function render(){$('#nv').innerHTML=S.name&&S.v!='home'?`<button class=g data-a=home>Home</button><button class=g data-a=dash>Dashboard</button>`:S.name?`<button class=g data-a=dash>Dashboard</button>`:'';$('#app').innerHTML=V[S.v]();const i=$('#ans');if(i&&!i.disabled)i.focus();if(S.v!=PV||S.v=='test')window.scrollTo(0,0);PV=S.v}

for(let i=0;i<10;i++){const nm=names[i%names.length],g=gen(nm);let q,k=0;do q=g();while(seen.has(q.q)&&++k<30);seen.add(q.q);qs.push({...q,topic:nm,last:'',ok:false,done:false,pts:0})}
const num=Math.max(0,...D.tests.filter(t=>t.student.toLowerCase()==S.name.toLowerCase()&&t.subject==S.subj).map(t=>t.num))+1;
S.t={i:0,qs,num,setNo,key,pup:0,id:`${S.name} - ${S.subj} - ${String(num).padStart(4,'0')}`};S.v='test';render()},
chk(){const q=cap();if(q.done)return;if(!q.last){q.fb='Type an answer first, then press Check Answer.';q.ok=false;render();return}
if(q.fmt&&check(q,q.last)){const fr=/\//.test(q.last);if(q.fmt=='f'&&q.last.replace(/\s/g,'')!==q.d){q.fb=fr?'That has the right value, but it is not in its simplest form. Simplify it and try again.':'That has the right value, but the question asks for a fraction, such as 3/8.';q.ok=false;render();return}if(q.fmt=='d'&&fr){q.fb='That has the right value, but the question asks for a decimal.';q.ok=false;render();return}}
if(check(q,q.last)){q.ok=q.done=true;q.pts=PUP[S.diff];S.t.pup+=q.pts;q.fb=`Correct! 🎉 +${q.pts} ${q.pts>1?'Puppies':'Puppy'} 🐶`;cheer()}else q.fb='Incorrect. Try again, or press Correction to see the answer.';render()},
exp(){const q=cap();q.showEx=!q.showEx;render()},
cor(){const q=cap();q.showCor=true;if(!q.ok){q.done=true;q.fb='Answer revealed. No Puppies awarded for this question.'}render()},
next(){const t=S.t;if(t.i<9){t.i++;render();return}
const rec={id:t.id,num:t.num,key:t.key,student:S.name,subject:S.subj,board:S.board,topic:S.topic,diff:S.diff,setNo:t.setNo,date:new Date().toISOString(),correct:t.qs.filter(q=>q.ok).length,puppies:t.pup,questions:t.qs.map(q=>({topic:q.topic,question:q.q,correctAnswer:q.a,answer:q.last,correct:q.ok,puppies:q.pts}))};
D.tests.push(rec);save();t.rec=rec;S.v='done';render()},
again(){S.v='subj';render()}};
document.body.onclick=e=>{const a=e.target.closest('[data-a]');if(a)A[a.dataset.a](a.dataset.v)};
/* Selecting a subject selects its exam board automatically */
document.body.onchange=e=>{if(e.target.id==='sb'){const s=e.target.value;$('#bd').value=BOARD[s]||'';$('#bn').textContent=bnote(s)}};
document.onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='ans')A.chk();if(e.key==='Enter'&&e.target.id==='nm')A.go()};
render();
</script></body></html>
