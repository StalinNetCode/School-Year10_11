const V={

test:()=>{const t=S.t,q=t.qs[t.i];return `<p><b>${esc(t.id)}</b> <span class=mu>(Attempt ${t.setNo})</span></p><div class=meta><span>Question ${t.i+1} of 10</span><span>${DIFF[S.diff]}</span><span>${esc(q.topic)}</span><span>${esc(brd(S.board))}</span><span>🐶 ${t.pup} earned</span><span>${t.qs.filter(x=>!x.done).length} left</span></div><div class=card><h2>Question</h2><p class=q>${q.q}</p><h3>Your Answer</h3><input id=ans value="${esc(q.last||'')}" ${q.done?'disabled':''} placeholder="Type your answer" autocomplete=off>${typeof q.a==='string'?'<p class=mu>Type powers with ^, for example 3x^2 - 5x + 2.</p>':''}<div><button data-a=chk ${q.done?'disabled':''}>Check Answer</button><button class=g data-a=exp>Explain</button><button class=g data-a=cor>Correction</button></div>${q.fb?`<p class="fb ${q.ok?'ok':'bad'}" role=status>${q.fb}</p>`:''}${q.showEx?`<div class=pn><h3>Explain</h3><p>${q.m}</p></div>`:''}${q.showCor?`<div class=pn><h3>Correction</h3><p><b>Correct answer:</b> ${esc(ans(q))}</p><p><b>Method:</b> ${q.m}</p><p><b>Working:</b> ${q.w}</p><p><b>Your answer:</b> ${q.ok?'Correct.':q.last?`You wrote "${esc(q.last)}", which doesn't match ${esc(ans(q))}. Compare it with the working above.`:'You did not enter an answer.'}</p><p class=mu>No Puppies are awarded for using Correction.</p></div>`:''}${q.done?`<button data-a=next>${t.i==9?'Finish test':'Next question'} →</button>`:''}</div>`},

dash:()=>{const T=mine().slice().reverse(),P=T.reduce((s,t)=>s+t.puppies,0),C=T.reduce((s,t)=>s+t.correct,0),N=T.length*10,by={},wt=pend().length;T.forEach(t=>by[t.subject]=(by[t.subject]||0)+t.puppies);const rec=T.slice(0,10).reverse(),mx=Math.max(1,...rec.map(t=>t.puppies));

<div class=card><h2>Puppies by subject</h2>${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<p>${k}: <b>${v} 🐶</b></p>`).join(''):'<p class=mu>Complete a test to start earning Puppies.</p>'}<h2>Puppies per recent test</h2><div class=bars>${rec.map(t=>`<i title="${esc(t.id)}: ${t.puppies}" style="height:${t.puppies/mx*100}%"></i>`).join('')}</div></div>
<h2>Recent tests</h2><div class=wrap><table><tr><th>Date<th>Test Number<th>Subject<th>Exam Board<th>Topic<th>Difficulty<th>Correct<th>Puppies</tr>${T.map(t=>`<tr><td>${new Date(t.date).toLocaleDateString('en-GB')}<td>${esc(t.id)}<td>${t.subject}<td>${esc(brd(t.board))}<td>${t.topic}<td>${DIFF[t.diff]}<td>${t.correct}/10<td>${t.puppies} 🐶</tr>`).join('')||'<tr><td colspan=8>No tests yet.</tr>'}</table></div>`}};
let PV='';function render(){$('#nv').innerHTML=S.ok?`${S.v!='home'?'<button class=g data-a=home>Home</button>':''}<button class=g data-a=dash>Dashboard</button><button class=g data-a=out>Sign out</button>`:'';$('#app').innerHTML=V[S.v]();const i=$('#ans');if(i&&!i.disabled)i.focus();if(S.v!=PV||S.v=='test')window.scrollTo(0,0);PV=S.v}
const cap=()=>{const i=$('#ans'),q=S.t.qs[S.t.i];if(i&&!q.done)q.last=i.value.trim();return q};
const A={
home(){S.v='home';render()},
dash(){if(!S.ok)return;S.v='dash';render();sync(pend()).then(j=>{if(j.status=='ok'){take(j);if(S.v=='dash')render()}}).catch(()=>{})},
out(){S.ok=false;S.pin='';S.t=null;S.v='home';render()},
/* Sign-in. A name that does not exist yet can be created (the PIN is typed twice). A student who was given a temporary PIN by the admin must choose their own PIN first. */
async go(){if(S.busy)return;const n=$('#nm').value.trim(),p=$('#pn').value.trim(),s=$('#sb').value,bd=$('#bd').value,pk=/^\d{4,8}$/.test(p),er=m=>{const e=$('#er');if(e)e.textContent=m};if(!n||!pk||!s){er(!n?'Enter your name to continue.':!pk?'Enter your PIN (4 to 8 digits).':'Select a subject to continue.');return}
S.name=n;S.pin=p;S.ok=false;S.subj=s;S.board=bd;S.busy=1;er('Signing in…');
try{let j=await sync(pend());if(j.status=='unknown'){const c=prompt(`There is no student called "${n}" yet.\n\nTo create a new student, type the PIN again to confirm it:`);if(c===null){er('');return}if(c.trim()!==p){er('The two PINs did not match, so nothing was created. Try again.');return}j=await sync(pend(),1)}
if(j.status=='change_pin'){const a=prompt(`Welcome, ${n}! The PIN you were given is temporary.\n\nChoose your own new PIN (4 to 8 digits) and keep it secret:`);if(a===null){er('Choose a new PIN to continue. Press Continue to try again.');return}const np=a.trim();if(!/^\d{4,8}$/.test(np)||np==p){er(np==p?'Your new PIN must be different from the temporary one. Press Continue to try again.':'A PIN must be 4 to 8 digits. Press Continue to try again.');return}const b=prompt('Type your new PIN again to confirm it:');if(b===null||b.trim()!==np){er('The two PINs did not match, so your PIN was not changed. Press Continue to try again.');return}
const x=await fetch(SB+'/rest/v1/rpc/portal_sync',{method:'POST',headers:{'Content-Type':'application/json',apikey:SK,Authorization:'Bearer '+SK},body:JSON.stringify({p_name:n,p_pin:p,p_tests:pend(),p_new_pin:np})});if(!x.ok)throw new Error('sync');j=await x.json();if(j.status=='ok')S.pin=np}
if(j.status!='ok'){er(j.status=='wrong_pin'?'That PIN does not match this name. Try again.':j.status=='locked'?'Too many wrong PINs. Wait 5 minutes, then try again.':'Could not sign in. Check the name and PIN.');return}
take(j);S.ok=true;D.last=n;save();S.diff=-1;S.topic='';S.v='subj';render()}catch(e){er('Could not reach the server. Check the internet connection and try again.')}finally{S.busy=0}},
diff(v){S.diff=+v;render()},top(v){S.topic=v;render()},
start(){if(S.topic!='Mixed'&&!(BANK[S.subj]||{})[S.topic])return;const tp=S.topic,key=[S.name.toLowerCase(),S.subj,tp,S.diff].join('|'),setNo=D.tests.filter(t=>t.key==key).length+1;R=rng(`${S.subj}|${tp}|${S.diff}|${setNo}|${Math.random()}`);const B=BANK[S.subj],names=tp=='Mixed'?shuf(Object.keys(B)):[tp],qs=[],seen=new Set,pool={},prev={};
const gen=nm=>{const all=[].concat(B[nm][S.diff]);if(!pool[nm]||!pool[nm].length){pool[nm]=shuf(all.slice());if(all.length>1&&pool[nm][pool[nm].length-1]==prev[nm])pool[nm].unshift(pool[nm].pop())}return prev[nm]=pool[nm].pop()};
for(let i=0;i<10;i++){const nm=names[i%names.length];let q,tries=0;do{const g=gen(nm);let k=0;do q=g();while(seen.has(q.q)&&++k<10)}while(seen.has(q.q)&&++tries<20);seen.add(q.q);qs.push({...q,topic:nm,last:'',ok:false,done:false,pts:0})}
const num=Math.max(0,...D.tests.filter(t=>t.student.toLowerCase()==S.name.toLowerCase()&&t.subject==S.subj).map(t=>t.num))+1;
S.t={i:0,qs,num,setNo,key,pup:0,id:`${S.name} - ${S.subj} - ${String(num).padStart(4,'0')}`};S.v='test';render()},
chk(){const q=cap();if(q.done)return;if(!q.last){q.fb='Type an answer first, then press Check Answer.';q.ok=false;render();return}
if(q.fmt&&check(q,q.last)){const fr=/\//.test(q.last);if(q.fmt=='f'&&q.last.replace(/\s/g,'')!==q.d){q.fb=fr?'That has the right value, but it is not in its simplest form. Simplify it and try again.':'That has the right value, but the question asks for a fraction, such as 3/8.';q.ok=false;render();return}if(q.fmt=='d'&&fr){q.fb='That has the right value, but the question asks for a decimal.';q.ok=false;render();return}}
if(check(q,q.last)){q.ok=q.done=true;q.pts=PUP[S.diff];S.t.pup+=q.pts;q.fb=`Correct! 🎉 +${q.pts} ${q.pts>1?'Puppies':'Puppy'} 🐶`;cheer()}else q.fb='Incorrect. Try again, or press Correction to see the answer.';render()},
exp(){const q=cap();q.showEx=!q.showEx;render()},

const rec={uid:window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),id:t.id,num:t.num,key:t.key,student:S.name,subject:S.subj,board:S.board,topic:S.topic,diff:S.diff,setNo:t.setNo,date:new Date().toISOString(),correct:t.qs.filter(q=>q.ok).length,puppies:t.pup,questions:t.qs.map(q=>({topic:q.topic,question:q.q,correctAnswer:q.a,answer:q.last,correct:q.ok,puppies:q.pts}))};
D.tests.push(rec);save();push();t.rec=rec;S.v='done';render()},

/* ---------- Whiteboard: a hidden working-out pad beside each question. Each question keeps its own drawing (q.wb) until the test ends; drawings are never saved or uploaded. ---------- */
const WBS={open:false,ink:'#1b1b1b',era:false},INK=[['#1b1b1b','Black'],['#1557c0','Blue'],['#c62828','Red'],['#1b7f3b','Green']];let wbRO=null;
const wbQ=()=>S.t.qs[S.t.i];
const WB=()=>`<div class="card wb"><div class=wbt><b>✏️ Working out</b>${INK.map(([c,n])=>`<button class="sw ${!WBS.era&&WBS.ink==c?'on':''}" data-a=wbc data-v="${c}" style="background:${c}" aria-label="${n} pen" title="${n} pen"></button>`).join('')}<button id=wbe class="g ${WBS.era?'on':''}" data-a=wbe>Eraser</button><button class=g data-a=wbu>Undo</button><button class=g data-a=wbx>Clear</button></div><canvas id=cv aria-label="Whiteboard for working out"></canvas><small class=mu>Draw with a finger, pen or mouse. Each question keeps its own working until the test ends.</small></div>`;
function wbPaint(cv,st){const x=cv.getContext('2d'),w=cv.width,p=st.p;x.globalCompositeOperation=st.e?'destination-out':'source-over';x.strokeStyle=st.c;x.lineWidth=(st.e?.06:.006)*w;x.lineCap=x.lineJoin='round';x.beginPath();x.moveTo(p[0][0]*w,p[0][1]*w);if(p.length==1)x.lineTo(p[0][0]*w+.01,p[0][1]*w);for(let i=1;i<p.length;i++)x.lineTo(p[i][0]*w,p[i][1]*w);x.stroke()}
function wbDraw(){const cv=$('#cv');if(!cv||!cv.clientWidth||!S.t)return;const d=window.devicePixelRatio||1;cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d);(wbQ().wb||[]).forEach(s=>wbPaint(cv,s))}
function wbUI(){document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',!WBS.era&&b.dataset.v==WBS.ink));const e=$('#wbe');if(e)e.classList.toggle('on',WBS.era)}
function wbInit(){const cv=$('#cv');if(!cv)return;const q=wbQ();q.wb=q.wb||[];let cur=null,lw=0;
const pt=e=>{const b=cv.getBoundingClientRect(),w=cv.clientWidth||1;return[(e.clientX-b.left-cv.clientLeft)/w,(e.clientY-b.top-cv.clientTop)/w]};
cv.onpointerdown=e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}cur={c:WBS.ink,e:WBS.era,p:[pt(e)]};q.wb.push(cur);wbPaint(cv,cur)};
cv.onpointermove=e=>{if(!cur)return;const p=pt(e),l=cur.p[cur.p.length-1];cur.p.push(p);wbPaint(cv,{c:cur.c,e:cur.e,p:[l,p]})};
cv.onpointerup=cv.onpointercancel=()=>{cur=null};
wbDraw();lw=cv.clientWidth;
if(window.ResizeObserver){wbRO=new ResizeObserver(()=>{if(cv.clientWidth!=lw){lw=cv.clientWidth;wbDraw()}});wbRO.observe(cv)}}
function wbMount(){document.body.classList.toggle('wide',S.v=='test'&&WBS.open);if(wbRO){wbRO.disconnect();wbRO=null}if(S.v!='test')return;const card=$('#app .card'),h=card&&card.querySelector('h2');if(!h)return;
const tw=document.createElement('div'),qh=document.createElement('div');tw.className='tw'+(WBS.open?' open':'');card.before(tw);tw.append(card);
qh.className='qh';h.before(qh);qh.append(h);qh.insertAdjacentHTML('beforeend',`<button class=g data-a=wb aria-expanded=${WBS.open}>✏️ ${WBS.open?'Hide':'Show'} whiteboard</button>`);
if(WBS.open){tw.insertAdjacentHTML('beforeend',WB());wbInit()}const i=$('#ans');if(i&&!i.disabled)i.focus()}

Object.assign(A,{wb(){cap();WBS.open=!WBS.open;render()},wbc(v){WBS.ink=v;WBS.era=false;wbUI()},wbe(){WBS.era=!WBS.era;wbUI()},wbu(){(wbQ().wb||[]).pop();wbDraw()},wbx(){(wbQ().wb||[]).length=0;wbDraw()}});
